appId: com.ven0m.mappainter
productName: "Ven0m's Map Painter"
copyright: Copyright © 2026 Ven0m

directories:
  output: release

files:
  - dist/**/*
  - node_modules/**/*
  - "!node_modules/**/README*"
  - "!node_modules/**/CHANGELOG*"

extraResources:
  - from: THIRD_PARTY_NOTICES.txt
    to: THIRD_PARTY_NOTICES.txt

npmRebuild: true

mac:
  icon: build/icon.icns
  category: public.app-category.graphics-design
  target:
    - dmg
    - zip

win:
  icon: build/favicon.ico
  target:
    - nsis
    - portable

nsis:
  artifactName: "venoms-map-painter-${version}-windows-${arch}-setup.${ext}"

portable:
  artifactName: "venoms-map-painter-${version}-windows-${arch}-portable.${ext}"

linux:
  artifactName: "venoms-map-painter-${version}-linux-${arch}.${ext}"
  executableName: venoms-map-painter
  maintainer: "Vem0n <94292470+Vem0n@users.noreply.github.com>"
  icon: build/icon.png
  category: Graphics
  target:
    - AppImage
    - deb
    - rpm
